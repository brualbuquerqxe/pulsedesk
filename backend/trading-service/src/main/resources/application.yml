spring:
  application:
    name: trading-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulsedesk?currentSchema=trading}
    username: ${SPRING_DATASOURCE_USERNAME:pulsedesk}
    password: ${SPRING_DATASOURCE_PASSWORD:pulsedesk_dev_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: trading

  flyway:
    enabled: true
    schemas: trading
    default-schema: trading

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
