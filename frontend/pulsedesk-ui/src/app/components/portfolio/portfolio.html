<p-card header="Portfolio">

  <p>Saldo: {{ portfolio?.cashBalance }}</p>

  <p-table [value]="portfolio?.positions ?? []">

    <ng-template #header>
      <tr>
        <th>Ativo</th>
        <th>Quantidade</th>
        <th>Preço médio</th>
        <th>Último preço</th>
      </tr>
    </ng-template>

    <ng-template #body let-position>
      <tr>
        <td>{{ position.symbol }}</td>
        <td>{{ position.quantity }}</td>
        <td>{{ position.averagePrice }}</td>
        <td>{{ position.lastPrice }}</td>
      </tr>
    </ng-template>

  </p-table>

</p-card>
