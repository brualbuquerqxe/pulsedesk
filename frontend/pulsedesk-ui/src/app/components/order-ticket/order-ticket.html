<p-card header="New Order">

  <div class="order-form">

    <div class="field">
      <label for="symbol">Symbol</label>

      <input
        id="symbol"
        pInputText
        [(ngModel)]="symbol"
      />
    </div>

    <div class="field">
      <label for="quantity">Quantity</label>

      <p-inputnumber
        inputId="quantity"
        [(ngModel)]="quantity"
        [min]="1"
      />
    </div>

    <div class="field">
      <label>Side</label>

      <p-selectbutton
        [options]="sideOptions"
        [(ngModel)]="side"
      />
    </div>

    <button
      pButton
      (click)="submitOrder()">
      Submit Order
    </button>

  </div>

</p-card>
