<div class="dashboard-header">

  <div class="header-title">
    <span class="page-eyebrow">
      PULSEDESK
    </span>

    <h1>
      Overview
    </h1>

    <span class="page-description">
      Monitor market data, portfolio, and trading activity.
    </span>
  </div>

  <div class="system-status" [class.disconnected]="!isRealtimeConnected">
    <span class="status-dot"></span>

    <span>
      {{
      isRealtimeConnected
      ? 'Connected in real time'
      : 'Disconnected in real time'
      }}
    </span>
  </div>

</div>

<div class="dashboard">

  <div class="market-data">
    <app-market-data />
  </div>

  <div class="order-ticket">
    <app-order-ticket />
  </div>

  <div class="analytics">
    <app-analytics />
  </div>

  <div class="portfolio">
    <app-portfolio />
  </div>

  <div class="portfolio-history">
    <app-portfolio-history />
  </div>

</div>
