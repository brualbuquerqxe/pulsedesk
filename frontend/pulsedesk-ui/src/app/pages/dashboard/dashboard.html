<div class="dashboard-header">

  <div class="header-title">
    <h1>PulseDesk</h1>
    <span>Event-Driven Brokerage Workstation</span>
  </div>

  <div class="system-status" [class.disconnected]="!isRealtimeConnected">
    <span class="status-dot"></span>

    <span>
      {{ isRealtimeConnected
      ? 'Realtime connected'
      : 'Realtime disconnected'
      }}
    </span>
  </div>

</div>

<div class="dashboard">

  <div class="market-data">
    <app-market-data />
  </div>

  <div class="order-ticket">
    <app-order-ticket />
  </div>

  <div class="portfolio">
    <app-portfolio />
  </div>

  <div class="analytics">
    <app-analytics />
  </div>

  <div class="order-history">
    <app-order-history />
  </div>

</div>
